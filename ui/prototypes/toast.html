<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toast｜状态提示</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .note {
      position: relative;
      min-height: 420px;
      padding: 32px 32px 96px;
    }
    .kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
    }
    h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.3;
    }
    .body {
      margin: 22px 0 0;
      max-width: 36em;
    }
    .caret {
      display: inline-block;
      width: 1px;
      height: 1.05em;
      margin-left: 1px;
      background: var(--ink);
      vertical-align: text-bottom;
    }
    .toast {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 10px 14px 10px 10px;
      border-radius: 12px;
      background: var(--sheet);
      border: 1px solid rgba(29, 26, 22, 0.06);
      box-shadow: 0 10px 28px rgba(40, 32, 24, 0.12);
    }
    .toast-mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--pine);
      color: #f4faf7;
      display: grid;
      place-items: center;
      flex: none;
    }
    .toast strong {
      font-weight: 600;
      font-size: 14px;
    }
    .toast span {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="name">Toast｜状态提示</h1>
    <p class="when">一次操作已经成功时，用它告知结果，并且不抢焦点。</p>
    <div class="stage">
      <article class="surface note">
        <p class="kicker">笔记</p>
        <h2>城南旧事</h2>
        <p class="body">灯市那一段还要再收一收。<span class="caret" aria-hidden="true"></span></p>
        <div class="toast" role="status">
          <span class="toast-mark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 7.2 5.6 9.8 11 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <strong>已保存</strong>
          <span>草稿写在这台设备上</span>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
