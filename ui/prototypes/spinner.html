<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spinner｜旋转加载</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .split {
      display: grid;
      grid-template-columns: 1fr 240px;
    }
    .doc { padding: 32px; }
    .kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .doc h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.3;
    }
    .doc p { margin: 16px 0 0; }
    .aside {
      border-left: 1px solid var(--line);
      padding: 28px 22px;
    }
    .aside h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .pending {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
    }
    @media (max-width: 680px) {
      .split { grid-template-columns: 1fr; }
      .aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="name">Spinner｜旋转加载</h1>
    <p class="when">用在持续时间未知的短任务上，放在触发的地方旁边，并写明正在做什么。</p>
    <div class="stage">
      <div class="surface split">
        <article class="doc">
          <p class="kicker">笔记</p>
          <h2>城南旧事</h2>
          <p>灯市那一段还要再收一收。出了城门，声音就淡了。</p>
        </article>
        <aside class="aside" aria-busy="true">
          <h2>目录</h2>
          <p class="pending">
            <svg class="spinner" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="8" fill="none" stroke="#e6dfd6" stroke-width="2.5"/>
              <circle cx="10" cy="10" r="8" fill="none" stroke="#1e5c44" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="18 32" transform="rotate(-90 10 10)"/>
            </svg>
            <span>正在生成目录</span>
          </p>
        </aside>
      </div>
    </div>
  </div>
</body>
</html>
