<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bottom Sheet｜底部面板</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .stage { display: flex; justify-content: center; }
    .phone {
      width: 320px;
      height: 660px;
      padding: 10px;
      border-radius: 36px;
      background: #1a1814;
      box-shadow: var(--shadow);
    }
    .screen {
      position: relative;
      height: 100%;
      border-radius: 28px;
      overflow: hidden;
      background: #f3efe8;
      color: var(--ink);
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 28px;
      padding: 10px 18px 0;
      font-size: 12px;
      font-weight: 600;
    }
    .battery {
      width: 22px;
      height: 10px;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      position: relative;
    }
    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 1.5px;
      height: 4px;
      background: var(--ink);
      border-radius: 1px;
    }
    .battery i {
      display: block;
      width: 14px;
      height: 6px;
      margin: 1px;
      background: var(--ink);
      border-radius: 1px;
    }
    .app { padding: 18px 18px 0; }
    .app h2 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
    }
    .app li {
      list-style: none;
      padding: 12px 0;
      border-bottom: 1px solid #e4ddd4;
      font-size: 15px;
    }
    .app ul { margin: 0; padding: 0; }
    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(29, 26, 22, 0.4);
    }
    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      padding: 8px 16px 18px;
      border-radius: 20px 20px 0 0;
      background: var(--sheet);
      box-shadow: 0 -10px 30px rgba(28, 25, 23, 0.12);
      display: flex;
      flex-direction: column;
    }
    .handle {
      width: 36px;
      height: 4px;
      margin: 4px auto 14px;
      border-radius: 99px;
      background: #d9d3cb;
    }
    .sheet h2 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 600;
    }
    .choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 15px;
    }
    .choice.picked {
      background: #f3f0ea;
      font-weight: 600;
    }
    .sheet-check { color: var(--pine); }
    .sheet .btn { margin-top: auto; width: 100%; }
    .home {
      width: 108px;
      height: 4px;
      margin: 10px auto 0;
      border-radius: 99px;
      background: #d5cfc6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="name">Bottom Sheet｜底部面板</h1>
    <p class="when">用在手机上的局部任务，或需要半屏、全屏几档高度的内容。</p>
    <div class="stage">
      <div class="phone">
        <div class="screen">
          <div class="status">
            <span class="num">7:25</span>
            <span class="battery" aria-hidden="true"><i></i></span>
          </div>
          <div class="app" aria-hidden="true">
            <h2>笔记</h2>
            <ul>
              <li>城南旧事</li>
              <li>灯市</li>
              <li>回声</li>
            </ul>
          </div>
          <div class="scrim"></div>
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="move-title">
            <div class="handle" aria-hidden="true"></div>
            <h2 id="move-title">移到书架</h2>
            <div class="choice">正在读</div>
            <div class="choice picked">
              南城
              <span class="sheet-check" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M3.2 8.2 6.4 11.4 12.8 4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <div class="choice">以后再读</div>
            <button class="btn" type="button">完成</button>
            <div class="home" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
