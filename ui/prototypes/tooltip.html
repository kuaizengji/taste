<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tooltip｜提示</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .note { padding: 56px 32px 36px; }
    .note-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }
    .kicker {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
    }
    h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.3;
    }
    .tools { display: flex; gap: 8px; }
    .tip-anchor { position: relative; }
    .tooltip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--tooltip);
      color: var(--tooltip-ink);
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(28, 25, 23, 0.16);
    }
    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--tooltip);
    }
    .body {
      margin: 28px 0 0;
      max-width: 36em;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="name">Tooltip｜提示</h1>
    <p class="when">用来解释图标的含义，或补一句简短说明。</p>
    <div class="stage">
      <article class="surface note">
        <div class="note-head">
          <div>
            <p class="kicker">笔记</p>
            <h2>城南旧事</h2>
          </div>
          <div class="tools">
            <button class="icon-btn" type="button" aria-label="收藏">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 3.2 11.8 7.6l4.7.4-3.6 3.1 1.1 4.6L10 13.2 6 15.7l1.1-4.6L3.5 8l4.7-.4L10 3.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="icon-btn" type="button" aria-label="分享">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M8 10.5 14.2 6M8 9.5l6.2 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="5.5" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="15" cy="5.2" r="2" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="15" cy="14.8" r="2" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
            <span class="tip-anchor">
              <button class="icon-btn is-focused" type="button" aria-describedby="visibility-tip" aria-label="可见范围">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <circle cx="10" cy="10" r="6.25" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M10 9.2V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="10" cy="6.6" r="0.8" fill="currentColor"/>
                </svg>
              </button>
              <span class="tooltip" id="visibility-tip" role="tooltip">只有你能看见这篇笔记。</span>
            </span>
          </div>
        </div>
        <p class="body">灯市那一段还要再收一收。出了城门，声音就淡了。</p>
      </article>
    </div>
  </div>
</body>
</html>
