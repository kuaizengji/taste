<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贴纸揭起</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .sheet {
      width: min(680px, 100%);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="name">贴纸揭起</h1>
    <p class="when">用手账、收藏册或个人主页里可以摆放的装饰贴纸；这一页只停在边角已经抬起的一帧。</p>
    <div class="stage">
      <svg class="sheet" viewBox="0 0 680 520" role="img" aria-label="边角抬起的贴纸：正面在折痕处被裁掉，纸背露出来，贴住的底边影子窄，抬起的一角影子更散。">
        <defs>
          <filter id="flap-shadow" x="-60%" y="-40%" width="220%" height="220%">
            <feOffset dx="2" dy="12" in="SourceAlpha" result="off"/>
            <feGaussianBlur in="off" stdDeviation="7" result="blur"/>
            <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.28 0" result="sh"/>
            <feMerge>
              <feMergeNode in="sh"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="body-shadow" x="-20%" y="-20%" width="140%" height="160%">
            <feOffset dx="0" dy="1.5" in="SourceAlpha" result="off"/>
            <feGaussianBlur in="off" stdDeviation="1.1" result="blur"/>
            <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0.4 0" result="sh"/>
            <feMerge>
              <feMergeNode in="sh"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <linearGradient id="back-paper" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#cbbba6"/>
            <stop offset="0.42" stop-color="#e4d5c2"/>
            <stop offset="1" stop-color="#f3eadc"/>
          </linearGradient>
          <clipPath id="front-clip">
            <path d="M16 0 H158 Q200 64 260 108 V244 Q260 260 244 260 H16 Q0 260 0 244 V16 Q0 0 16 0 Z"/>
          </clipPath>
          <clipPath id="flap-clip">
            <path d="M158 0 Q200 64 260 108 Q292 62 278 16 Q236 -22 188 -6 Q166 -2 158 0 Z"/>
          </clipPath>
        </defs>

        <rect width="680" height="520" rx="12" fill="#f3eee6"/>
        <line x1="64" y1="28" x2="64" y2="492" stroke="#e4b4ae" stroke-width="1"/>
        <g stroke="#e6dfd4" stroke-width="1">
          <line x1="28" y1="64" x2="652" y2="64"/>
          <line x1="28" y1="104" x2="652" y2="104"/>
          <line x1="28" y1="144" x2="652" y2="144"/>
          <line x1="28" y1="184" x2="652" y2="184"/>
          <line x1="28" y1="224" x2="652" y2="224"/>
          <line x1="28" y1="264" x2="652" y2="264"/>
          <line x1="28" y1="304" x2="652" y2="304"/>
          <line x1="28" y1="344" x2="652" y2="344"/>
          <line x1="28" y1="384" x2="652" y2="384"/>
          <line x1="28" y1="424" x2="652" y2="424"/>
          <line x1="28" y1="464" x2="652" y2="464"/>
        </g>

        <g transform="translate(210 128)">
          <path
            d="M158 0 Q200 64 260 108 Q292 62 278 16 Q236 -22 188 -6 Q166 -2 158 0 Z"
            fill="url(#back-paper)"
            filter="url(#flap-shadow)"
          />
          <g clip-path="url(#flap-clip)">
            <ellipse cx="236" cy="36" rx="42" ry="16" fill="#fff" opacity="0.38" transform="rotate(-28 236 36)"/>
          </g>
          <path d="M158 0 Q200 64 260 108" fill="none" stroke="#fffaf4" stroke-width="9" stroke-linecap="round"/>
          <g filter="url(#body-shadow)">
            <g clip-path="url(#front-clip)">
              <rect width="260" height="260" fill="#fbf7f0"/>
              <rect x="14" y="14" width="232" height="232" fill="none" stroke="#ddd4c6"/>
              <text x="28" y="118" fill="#1d1a16" font-size="42" font-family="Inter, WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">城南</text>
              <text x="30" y="150" fill="#5f584f" font-size="16" font-family="Inter, WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">手记</text>
              <circle cx="46" cy="198" r="16" fill="#9d3a32"/>
              <text x="46" y="203" text-anchor="middle" fill="#fffaf8" font-size="13" font-family="Inter, WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">印</text>
            </g>
          </g>
          <path d="M16 0 H158 Q200 64 260 108 V244 Q260 260 244 260 H16 Q0 260 0 244 V16 Q0 0 16 0 Z" fill="none" stroke="#e4dcd0"/>
          <path d="M158 0 Q200 64 260 108" fill="none" stroke="#b7a894" stroke-width="1.4" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
