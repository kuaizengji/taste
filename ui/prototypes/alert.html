<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面 Alert</title>
  <link rel="stylesheet" href="base.css">
  <style>
    .note { padding: 28px 28px 36px; }
    .page-alert {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px 12px;
      padding: 14px 16px;
      border: 1px solid #eadfd4;
      border-radius: 12px;
      background: #fbf6f1;
    }
    .banner-icon {
      grid-row: 1 / span 2;
      color: var(--cinnabar);
      margin-top: 1px;
    }
    .page-alert h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
    }
    .page-alert p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .alert-actions {
      grid-column: 2;
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .doc { margin-top: 28px; }
    .doc h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.3;
    }
    .doc p {
      margin: 12px 0 0;
      max-width: 36em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="name">页面 Alert</h1>
    <p class="when">用来提醒当前页面上的重要情况，说明影响和下一步，不锁住整页。</p>
    <div class="stage">
      <article class="surface note">
        <div class="page-alert" role="status">
          <span class="banner-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path d="M11 3.2 19.2 18H2.8L11 3.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M11 9.2v4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="11" cy="15.6" r="0.8" fill="currentColor"/>
            </svg>
          </span>
          <h2>另一台设备还有未同步的修改</h2>
          <p>继续在这里写，可能会盖掉那边的 3 处改动。</p>
          <div class="alert-actions">
            <button class="btn btn-quiet" type="button">查看差异</button>
            <button class="btn btn-text" type="button">关闭</button>
          </div>
        </div>
        <div class="doc">
          <h2>城南旧事</h2>
          <p>灯市那一段还要再收一收。出了城门，声音就淡了。</p>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
